org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 注意：这里**不要**再放 android.aapt2FromMavenOverride=/opt/castkit-host/bin/aapt2。
# 那是原 aarch64 容器里用 qemu 跑 x86_64 aapt2 的包装脚本路径，本机不存在；
# 一旦写在这里，Windows 侧（含 Android Studio 同步）会直接以
# "Custom AAPT2 location does not point to an AAPT2 executable" 失败，
# 而 tools/ 下的脚本没有任何一处会写这个值，所以它不是必需项。
# 本机 WSL 构建与 Windows/Android Studio 构建都不需要它。

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# 官方 Compose Preview 截图测试（com.android.compose.screenshot）必需开关：
# 打开后 :app 会多出 update<Variant>ScreenshotTest / validate<Variant>ScreenshotTest 任务，
# 在 JVM 上用 layoutlib 渲染 @Preview 成 PNG，不需要模拟器或真机。
android.experimental.enableScreenshotTest=true
