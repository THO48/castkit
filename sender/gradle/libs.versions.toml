[versions]
agp = "8.9.2"
kotlin = "2.1.0"
compose-bom = "2024.12.01"
lifecycle = "2.8.7"
activity-compose = "1.9.3"
core-ktx = "1.15.0"
coroutines = "1.9.0"
# 官方 Compose Preview 截图测试插件（AGP 8.9.x 对应分支）。
# 版本号必须与 AGP 匹配，插件自己会校验；0.0.1-alpha11 是 AGP 8.9 那条线的版本。
screenshot = "0.0.1-alpha11"
# 与接收端保持一致；NextLib 的版本号规则要求媒体库版本对齐（发送端目前只用 ExoPlayer 本体）
media3 = "1.11.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
androidx-lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# 播放器控制栏的淡入淡出（AnimatedVisibility / fadeIn / fadeOut）。
# 它此前只是经 foundation 传递进来的，现在直接用到，所以显式声明，不依赖传递依赖。
compose-animation = { group = "androidx.compose.animation", name = "animation" }
# 截图测试的 @PreviewTest 注解所在工件。版本必须与截图插件版本一致，
# 所以复用 screenshot 这个 version.ref（alpha 线，AGP 8.9.x）。
screenshot-validation-api = { group = "com.android.tools.screenshot", name = "screenshot-validation-api", version.ref = "screenshot" }
kotlinx-coroutines = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
# 本地播放引擎：系统 MediaPlayer 在解封装环节没有自主权（安卓自带的 MPEG4Extractor
# 遇到病态时间基会直接弃轨），换成 Media3 之后用它的 Mp4Extractor 才播得出来。
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-compose-screenshot = { id = "com.android.compose.screenshot", version.ref = "screenshot" }
