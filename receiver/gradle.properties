org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# CastKit: Kotlin 编译守护进程在本机启动/通信不稳定（Daemon compilation failed: null），
# 改为在 Gradle 守护进程内编译（in-process），并把常驻内存调大。
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx2048m

# CastKit: aapt2 只有 linux x86_64 版本，本机是 aarch64，
# 用 qemu 用户态模拟的包装脚本替代（见 tools/setup-host-compat.sh）
android.aapt2FromMavenOverride=/opt/castkit-host/bin/aapt2
