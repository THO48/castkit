org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# CastKit: Kotlin 编译守护进程在本机启动/通信不稳定（Daemon compilation failed: null），
# 改为在 Gradle 守护进程内编译（in-process），并把常驻内存调大。
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx2048m

# 注意：这里**不要**再放 android.aapt2FromMavenOverride=/opt/castkit-host/bin/aapt2。
# 那是原 aarch64 容器里用 qemu 跑 x86_64 aapt2 的包装脚本路径，本机不存在；
# 一旦写在这里，Windows 侧（含 Android Studio 同步）会直接以
# "Custom AAPT2 location does not point to an AAPT2 executable: /opt/castkit-host/bin/aapt2" 失败。
# 而 tools/ 下的脚本没有任何一处会写这个值，所以它不是必需项
# （tools/setup-host-compat.sh 只负责生成包装脚本，并不注入该属性）。
# 与 sender/gradle.properties 保持一致。
